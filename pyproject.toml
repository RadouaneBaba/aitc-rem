[project]
name = "aitc-rem-server"
version = "0.1.0"
description = "AITC-REM pipeline, evidence store, validators and renderers"
requires-python = ">=3.12"

dependencies = [
    # API surface (SS15.4)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "httpx>=0.28",
    "pyyaml>=6.0",

    # Evidence store + MCP tool server (SS8)
    "mcp>=1.2",

    # Renderers (SS11)
    "gherkin-official>=33.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Kept separate: heavy, and not needed for MM0-MM7 which make no model calls.
models = [
    "google-genai>=1.0",
]
# Phase 2 -- step library embeddings (SS15.1). Heavy (torch); install when needed.
library = [
    "sentence-transformers>=3.4",
    "sqlite-vec>=0.1.6",
]
# Phase 2 -- local narration transcription (SS6.6).
transcription = [
    "faster-whisper>=1.1",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "datamodel-code-generator>=0.28",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:server.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Generated by datamodel-code-generator; not hand-edited.
"server/models/generated/*" = ["ALL"]

[project]
name = "aitc-rem-server"
version = "0.1.0"
description = "AITC-REM pipeline, evidence store, validators and renderers"
requires-python = ">=3.12"

dependencies = [
    # API surface (SS15.4)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "httpx>=0.28",
    "pyyaml>=6.0",

    # Evidence store + MCP tool server (SS8)
    "mcp>=1.2,<2",

    # Renderers (SS11). gherkin-official is bounded on purpose: it has shipped
    # nine majors recently, and a new AST shape would silently change what
    # `gherkin_parses` reports -- a reproducibility bug in an ablation.
    "gherkin-official>=33,<43",
    "openpyxl>=3.1",

    # Step library (SS12). Lexical near-duplicate matching, no dependencies
    # of its own. The requirement is wording reuse, not paraphrase search.
    "rapidfuzz>=3.14",
]

[project.optional-dependencies]
# Kept separate: heavy, and not needed for MM0-MM7 which make no model calls.
models = [
    "google-genai>=1.0",
]
# Phase 2 -- local narration transcription (SS6.6).
transcription = [
    "faster-whisper>=1.1",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    # Pinned exactly, not floored: `schema/codegen.sh --check` regenerates and
    # diffs, so a newer generator or formatter than the one that produced the
    # committed output reads as SCHEMA DRIFT on a clean machine.
    "ruff==0.16.3",
    "datamodel-code-generator==0.74.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:server.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Generated by datamodel-code-generator; not hand-edited.
"server/models/generated/*" = ["ALL"]

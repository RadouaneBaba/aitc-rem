<!doctype html>
<!--
  Loaded into an iframe from a different origin (127.0.0.1 while the app runs on
  localhost). Exercises FramePath and, when host permissions are withheld,
  cross_origin_frame_blocked.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Payment details</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 0; padding: 16px; background: #fafafa; }
      label { display: block; margin: 10px 0 4px; font-weight: 500; }
      input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
      button { margin-top: 14px; padding: 8px 14px; border: 0; border-radius: 4px; background: #2f6f4f; color: #fff; cursor: pointer; }
      #frame-status { margin-top: 12px; color: #2f6f4f; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h2>Payment details</h2>
      <form id="pay-form">
        <label for="card">Card number</label>
        <input id="card" name="card" autocomplete="cc-number" value="4539578763621486" />

        <label for="cardholder">Cardholder name</label>
        <input id="cardholder" name="cardholder" value="A Tester" />

        <button type="submit">Save payment method</button>
      </form>
      <div id="frame-status" role="status" aria-live="polite"></div>
    </main>
    <script>
      document.getElementById('pay-form').addEventListener('submit', (e) => {
        e.preventDefault();
        document.getElementById('frame-status').textContent = 'Payment method saved';
      });
    </script>
  </body>
</html>

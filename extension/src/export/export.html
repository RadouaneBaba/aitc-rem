<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ready to send &middot; AITC</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      /* The last screen before anything leaves the browser.
       *
       * It used to read as a debug page. The second heading was "Schema check",
       * then "What will leave this browser", then a table of
       * `<<placeholder>> | category | 3x`, and the primary action sat below all
       * of it inline with a raw server URL field.
       *
       * Three questions now, in the order a tester asks them: what did I
       * record, what is hidden, and can I send it. The schema check is four
       * characters in the summary line, and it only becomes a section when it
       * fails -- which is the one time it means anything to the reader. */

      body {
        font-family: var(--font);
        font-size: var(--fs-base);
        line-height: var(--lh);
        color: var(--ink);
        background: var(--bg);
        margin: 0;
      }

      .bar {
        display: flex;
        align-items: center;
        gap: var(--s-2);
        padding: var(--s-3) var(--s-5);
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      .wordmark {
        display: inline-flex; align-items: center; gap: 7px;
        font-family: var(--font-display); font-weight: 700;
        font-size: var(--fs-lg); letter-spacing: 0.06em;
      }
      .wordmark svg { width: 19px; height: 19px; }
      .ring { fill: none; stroke: var(--brand); stroke-width: 2; }
      .dot { fill: var(--brand); }
      .spacer { flex: 1; }

      main { max-width: 780px; margin: 0 auto; padding: var(--s-6) var(--s-5) var(--s-7); }

      h1 {
        font-family: var(--font-display);
        font-size: var(--fs-3xl);
        font-weight: 700;
        letter-spacing: var(--track-tight);
        margin: 0 0 var(--s-2);
      }
      h2 {
        font-family: var(--font-display);
        font-size: var(--fs-xl);
        font-weight: 600;
        letter-spacing: var(--track-tight);
        margin: var(--s-6) 0 var(--s-3);
      }

      .summary {
        display: flex; flex-wrap: wrap; gap: var(--s-3);
        font-size: var(--fs-lg); color: var(--muted);
        margin: 0 0 var(--s-6);
      }
      .summary b { color: var(--ink); font-variant-numeric: tabular-nums; }
      .ok { color: var(--accent); font-weight: 600; }
      .bad { color: var(--danger); font-weight: 600; }
      .muted { color: var(--muted); }
      .small { font-size: var(--fs-sm); line-height: var(--lh-snug); }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        padding: var(--s-4);
        box-shadow: var(--shadow-1);
      }

      /* What you recorded. The frames were captured, held in memory on this
         very page, and reported as a COUNT. */
      .film { display: flex; gap: var(--s-2); overflow-x: auto; padding-bottom: var(--s-2); }
      .film figure { margin: 0; flex: none; width: 168px; }
      .film img {
        display: block; width: 168px; height: 104px;
        object-fit: cover; object-position: top;
        border: 1px solid var(--line); border-radius: var(--r-md);
        background: var(--subtle-bg);
      }
      .film figcaption {
        font-family: var(--font-mono); font-size: var(--fs-xs);
        color: var(--muted); margin-top: 4px;
      }
      .objective { margin: var(--s-3) 0 0; font-size: var(--fs-lg); }
      .objective q { quotes: '\201C' '\201D'; }

      /* Said once, in the flow, and never as a blocker: a recording with no
         mark is a normal recording. Warn rather than danger for the same
         reason -- nothing is wrong, something is just weaker than it could be. */
      .unmarked {
        margin: var(--s-3) 0 0;
        padding: var(--s-3);
        border-left: 3px solid var(--warn);
        background: var(--subtle-bg);
        font-size: var(--fs-md);
        line-height: var(--lh-snug);
      }

      table { width: 100%; border-collapse: collapse; }
      td { padding: var(--s-2); border-bottom: 1px solid var(--line-soft); }
      td:first-child { width: 40%; }
      tr:last-child td { border-bottom: 0; }
      code {
        font-family: var(--font-mono); font-size: var(--fs-sm);
        background: var(--subtle-bg); padding: 1px 5px; border-radius: var(--r-sm);
      }
      pre {
        font-family: var(--font-mono); font-size: var(--fs-sm);
        background: var(--danger-bg); color: var(--danger);
        border: 1px solid var(--danger-line);
        padding: var(--s-3); border-radius: var(--r-md); overflow-x: auto;
      }

      .note {
        background: var(--subtle-bg);
        border-left: 3px solid var(--brand);
        padding: var(--s-3) var(--s-4);
        border-radius: 0 var(--r-sm) var(--r-sm) 0;
        font-size: var(--fs-md);
        margin: var(--s-3) 0 0;
      }

      button {
        font: inherit; font-weight: 500;
        border: 1px solid var(--line); background: var(--panel); color: var(--ink);
        border-radius: var(--r-md); padding: 8px var(--s-4); cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: var(--muted); }
      button:disabled { opacity: 0.45; cursor: default; }
      button.primary {
        background: var(--brand); border-color: var(--brand); color: var(--on-brand);
        font-size: var(--fs-lg); font-weight: 600;
        padding: 13px var(--s-6); border-radius: var(--r-lg);
      }
      input {
        font: inherit; padding: 7px var(--s-3);
        border: 1px solid var(--line); border-radius: var(--r-md);
        background: var(--panel); color: var(--ink);
      }
      a { color: var(--brand); }
      audio { width: 100%; }

      :where(button, a, input, summary, [tabindex]):focus-visible {
        outline: var(--focus); outline-offset: var(--focus-offset);
      }

      /* The send block: the primary action, then the two quieter ways out. */
      .send { margin-top: var(--s-7); padding-top: var(--s-5); border-top: 1px solid var(--line); }
      .send-row { display: flex; align-items: center; gap: var(--s-4); flex-wrap: wrap; }
      .alt { display: flex; align-items: center; gap: var(--s-4); margin-top: var(--s-4); font-size: var(--fs-md); }
      .alt button { border-color: transparent; background: none; color: var(--muted); padding: 4px 0; }
      .alt button:hover { color: var(--ink); border-color: transparent; text-decoration: underline; }
      details summary { cursor: pointer; color: var(--muted); font-size: var(--fs-md); }
      details .row { display: flex; align-items: center; gap: var(--s-2); margin-top: var(--s-3); }
      #sent, #saved { margin-top: var(--s-4); }
    </style>
  </head>
  <body>
    <div class="bar">
      <span class="wordmark">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="10" cy="10" r="9" class="ring" />
          <rect x="6.5" y="6.5" width="7" height="7" rx="1.5" class="dot" />
        </svg>
        AITC
      </span>
      <span class="spacer"></span>
      <a id="howto" href="#">How to use this</a>
    </div>

    <main>
      <h1>Ready to send</h1>
      <p class="summary" id="summary"></p>

      <div id="invalid"></div>

      <h2>What you recorded</h2>
      <div class="card" id="recorded"></div>

      <h2>What is hidden</h2>
      <div class="card" id="redaction"></div>

      <div id="narration-section" hidden>
        <h2>What you said</h2>
        <div class="card" id="narration"></div>
      </div>

      <div class="send">
        <div class="send-row">
          <button class="primary" id="send">Send to AITC</button>
          <span class="muted small">
            Runs on your own machine and opens the draft for review. Nothing leaves this computer.
          </span>
        </div>
        <p id="sent" class="muted"></p>

        <div class="alt">
          <button id="save">Save the file instead</button>
          <details>
            <summary>Advanced</summary>
            <div class="row">
              <label for="server">Server</label>
              <input id="server" value="http://127.0.0.1:8000" size="26" />
            </div>
          </details>
        </div>
        <p id="saved" class="muted small"></p>
      </div>
    </main>
  </body>
  <script type="module" src="export.js"></script>
</html>

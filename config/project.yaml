# How generated test artifacts should read, for this project.
#
# The pipeline decides what is true; this file decides how it reads. Every
# setting below has a default that produces good output, so deleting this file
# changes nothing except that you lose the ability to disagree with it.

# Which worked feature file the author is shown, and therefore how the output
# reads. It changes the EXAMPLE, never the rules and never what may be claimed:
# a business-style document is bound exactly as tightly as an automation one.
#
#   automation -> every action, specific values, a check wherever there is
#                 something worth checking. For whoever writes the step
#                 definitions.
#   business   -> few steps, plain language, one verdict at the end of each
#                 scenario. For whoever decides the behaviour is right.
#   data-driven -> a repeated flow becomes one `Scenario Outline` with the
#                 values in an `Examples` table. For a session where the tester
#                 did the same thing several times with different inputs; it
#                 writes plain scenarios for everything that happened once.
#
# Adding a fourth is writing `server/pipeline/styles/<name>.md` -- one good
# feature file in that style, with its annotations beside it. Nothing else in
# the pipeline changes, which is the point: every attempt in this project's
# history to change output with a RULE measured at or near zero uptake, and
# every improvement came from a better example.
style: automation

# Subject of every step sentence. "I" switches to the classic Cucumber register
# ("When I sign in"); "the tester" and "the user" stay third person.
voice: the tester

# Tags applied to every test case, on top of whatever the pipeline proposes.
# A scenario with any step needing human review also gets @needs-review.
tags: []

# sidecar -> write <case>.trace.md beside the .feature and keep the feature body
#            free of traceability comments
# none    -> write neither; the evidence still lives in ir.json and trace.json,
#            which is what the validators read
trace: sidecar

# inline  -> quote captured values and <<placeholders>> directly in step text,
#            in a plain Scenario. A tester executing the test reads top to
#            bottom and never looks in two places for one value.
# outline -> lift the placeholders into a Scenario Outline with an Examples row.
parameters: inline

# Filename stem for the rendered feature. Available: {caseId} {title} {recordingId}
feature_name: "{caseId}"

# One provenance line at the top of the feature file, naming the recording and
# the sidecar. Set false if you want the file to look hand-written.
header: true

# Extra formats written alongside the .feature file. The feature and its
# evidence sidecar are always produced -- the validators read them.
#   xlsx  -> one workbook per run, a sheet per test case, plus preconditions,
#            parameters, evidence and warnings sheets
#   jira  -> one issue payload per test case, in Atlassian Document Format.
#            Built and written to disk, never posted: sending needs a site,
#            a project key and an API token.
#
# xlsx is on by default. The larger half of SS2.2's wedge does not write
# Gherkin, and the workbook -- with its Pass / Fail column and its Evidence
# sheet -- is the file that half actually opens.
exports: [xlsx, jira]

# Xray (a Jira app). There is no exporter, because your .feature file IS the
# import format:
#
#   TOKEN=$(curl -s -X POST https://xray.cloud.getxray.app/api/v2/authenticate #     -H 'Content-Type: application/json' #     -d '{"client_id":"...","client_secret":"..."}' | tr -d '"')
#   curl -X POST 'https://xray.cloud.getxray.app/api/v2/import/feature?projectKey=TR' #     -H "Authorization: Bearer $TOKEN" -F 'file=@tc_rec_xxx.feature'
#
# Each Scenario becomes a Jira Test. Set test_key to have a re-import UPDATE an
# existing Test rather than create a second one -- it emits Xray's @TEST_<KEY>
# tag on the scenario. Leave empty unless you use Xray.
xray:
  test_key: ""

# TestRail has an official CLI that already does this; there is nothing to build:
#
#   trcli -y -h https://you.testrail.io --project "Your Project" #     parse_gherkin -f tc_rec_xxx.feature

jira:
  issue_type: Task
  project_key: "QA"
  # Post to Jira automatically at the end of every run that emits the `jira`
  # export, instead of running `server.cli jira-push` by hand. Off by default:
  # posting creates issues in a shared system and nothing de-duplicates, so a
  # re-export files the same issues again. On here for a private test Jira.
  # Needs JIRA_SITE / JIRA_EMAIL / JIRA_API_TOKEN in .env; absent, the run says
  # so and still succeeds.
  auto_push: true

# Narration (SS6.6). The tester talks while they record; the audio is
# transcribed HERE, on this machine, and never uploaded anywhere.
#
# Narration is the only lossy evidence source in this tool. Everything else --
# node names, URLs, response bodies, console text -- is read exactly. A
# transcript is a reconstruction, and a mis-heard number becomes a literal that
# passes every grounding check and is still false. That is what min_confidence
# is for, and why the model default is not the smallest one.
narration:
  # tiny | base | small | medium | large-v3 | large-v3-turbo, or any local
  # CTranslate2 model. Downloaded on first use. `base` is noticeably worse on
  # exactly the numbers and proper nouns a test case is made of.
  model: small

  # `auto` detects it. Pinning it (en, fr, ar) is both faster and more accurate
  # on a short clip than detection is.
  language: auto

  # Below this, a segment is still stored, still shown, and still readable in
  # the review UI -- it just cannot support the `narrated` provenance. A
  # transcription nobody trusts must not outrank an honest inference.
  min_confidence: 0.5

  # Keep the audio after transcribing. On by default because it is the only way
  # a human can check a lossy transcript: the review UI plays the clip beside
  # the assertion it produced. Set false to delete it once transcribed.
  keep_audio: true

# What to do when a recording touches an origin that is not in
# config/allowed_origins.yaml.
#
# The thing being guarded is a property of the model TIER, not of the provider:
# free-tier prompts may be used for training and read by human reviewers, so a
# recording of a real customer application does not belong on one. A paid
# endpoint carrying a no-training term makes the whole question moot.
#
#   allowlist -> refuse to run. For a project handling real data on a free tier.
#   warn      -> run, and say which origins were unknown. The default.
#   off       -> do not check. For a paid, no-training endpoint.
origin_policy: warn

# Redaction is NOT configured here, and that is deliberate.
#
# It happens in the browser, before anything is written to disk, so by the time
# this file could be read the decision has already been taken and cannot be
# revisited. The recorder popup owns it -- under "Redaction", before you press
# Start -- and the level travels with the recording in
# `metadata.redaction`, so a session of a demo app and a session of a system
# whose order references scan as card numbers can sit in the same project and
# each still means what it meant when it was made.
#
# Two things follow from a recording made below `full`:
#
#   * `no_placeholder_leak` warns instead of refusing to render. You cannot ask
#     for the raw values and also gate on their absence.
#   * the run is REFUSED unless `origin_policy` is `off`. Free-tier prompts may
#     be used for training and read by human reviewers, and this is the one
#     mistake nobody can take back.
